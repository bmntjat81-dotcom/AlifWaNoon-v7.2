name: Build AlifWaNoon v7.2 APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          echo "Building APK..."
          gradle assembleDebug --stacktrace || ./gradlew assembleDebug --stacktrace
          ls -lh app/build/outputs/apk/debug/ || ls -lh **/apk/debug/ || find . -name "*.apk"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AlifWaNoon-v7.2-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk

      - name: Get version
        run: echo "v7.2-230features"
